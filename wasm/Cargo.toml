[package]
name = "simujaules-wasm"
# Tracks backend/Cargo.toml — src/lib.rs include!s backend/src/main.rs verbatim,
# so this crate IS the backend engine compiled for the browser.
version = "0.2.0"
edition = "2021"
publish = false
description = "In-browser WebAssembly build of the Simujaules native engine (backend/src/main.rs)"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# The same dependency set as backend/ — main.rs is pasted in whole, so its
# imports must resolve. The HTTP half (tiny_http, flate2, main) compiles but is
# dead code on wasm and LTO strips it; rayon falls back to the calling thread
# (thread spawning is unsupported on wasm*-unknown-unknown).
[dependencies]
tiny_http = "0.12"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = "1"
flate2 = "1"

[profile.release]
lto = true
codegen-units = 1
